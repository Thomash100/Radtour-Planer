services:
  postgres:
    image: imresamu/postgis:16-3.4-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radreise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-on-rpi}
      POSTGRES_DB: ${POSTGRES_DB:-radreiseplaner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radreise} -d ${POSTGRES_DB:-radreiseplaner}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    image: radtour-planer-app:latest
    build:
      context: .
      dockerfile: Dockerfile.rpi
      args:
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
        NEXT_PUBLIC_BUILD_DATE: "${NEXT_PUBLIC_BUILD_DATE:-2026-06-03}"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-radreise}:${POSTGRES_PASSWORD:-change-me-on-rpi}@postgres:5432/${POSTGRES_DB:-radreiseplaner}?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_BUILD_DATE: "${NEXT_PUBLIC_BUILD_DATE:-2026-06-03}"
      ROUTING_PROVIDER: "${ROUTING_PROVIDER:-brouter}"
      BROUTER_BASE_URL: "${BROUTER_BASE_URL:-https://brouter.de/brouter}"
      ROUTING_TIMEOUT_MS: "${ROUTING_TIMEOUT_MS:-60000}"
      ROUTING_MAX_SEGMENT_KM: "${ROUTING_MAX_SEGMENT_KM:-80}"
      ACCOMMODATION_PROVIDER: "${ACCOMMODATION_PROVIDER:-production}"
      ACCOMMODATION_API_URL: "${ACCOMMODATION_API_URL:-}"
      ACCOMMODATION_TIMEOUT_MS: "${ACCOMMODATION_TIMEOUT_MS:-4000}"
      ACCOMMODATION_CACHE_TTL_MS: "${ACCOMMODATION_CACHE_TTL_MS:-900000}"
      NODE_ENV: "production"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  worker:
    image: radtour-planer-app:latest
    build:
      context: .
      dockerfile: Dockerfile.rpi
      args:
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
        NEXT_PUBLIC_BUILD_DATE: "${NEXT_PUBLIC_BUILD_DATE:-2026-06-03}"
    restart: unless-stopped
    command: sh -c "sh scripts/wait-for-services.sh redis && npm run worker"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-radreise}:${POSTGRES_PASSWORD:-change-me-on-rpi}@postgres:5432/${POSTGRES_DB:-radreiseplaner}?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const Redis=require('ioredis'); const redis=new Redis(process.env.REDIS_URL); const timeout=setTimeout(()=>{redis.disconnect();process.exit(1)},5000); redis.ping().then(()=>{clearTimeout(timeout); redis.disconnect(); process.exit(0)}).catch(()=>{clearTimeout(timeout); redis.disconnect(); process.exit(1)})\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
